<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>О себе — Илья Бахмутов</title>
    <meta name="description"
        content="Обо мне — Илья Бахмутов, продуктовый дизайнер с пятью годами опыта в биг-техах, стартапах и агентствах.">

    <!-- Google Fonts (Geist) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.0.3/dist/fonts/geist-sans/style.css">

    <link rel="stylesheet" href="styles.css?v=case-viewer">

</head>

<body>
    <div class="ui-app-container">

        <div class="ui-badge-container">
            <div class="ui-badge-lanyard"></div>
            <div class="ui-badge-ring"></div>
            <div class="ui-badge-clip"></div>
            <div class="ui-badge-card">
                <div class="ui-badge-avatar">
                    <img src="assets/ava.png" alt="Илья Бахмутов">
                </div>
                <div class="ui-badge-info">
                    <h1 class="ui-badge-name ui-body-l-accent" style="color: var(--text-primary);">Илья Бахмутов</h1>
                    <p class="ui-body-m" style="color: var(--text-secondary);">Продуктовый дизайнер</p>
                </div>
            </div>
        </div>

        <!-- Nav injected by script.js → renderNav() -->
        <div id="app-nav"></div>

        <div class="ui-content-wrapper">
            <main>

                <section class="ui-about-container">
                    <p class="ui-body-l" style="color: var(--text-primary);">Я пять лет проектирую интерфейсы для&nbsp;цифровых сервисов, веб и мобильных приложений. За это время успел поработать в&nbsp;биг-техах, стартапах и&nbsp;агентствах</p>
                    <p class="ui-body-l" style="color: var(--text-primary);">Могу работать с концептами и крупными задачами, при&nbsp;этом не боюсь рутины и&nbsp;умею быстро «нарисовать и&nbsp;сдать»</p>
                </section>

                <section id="about-experience"></section>

                <section id="about-tools"></section>

                <section id="about-contacts"></section>

                <div id="app-footer"></div>
            </main>
        </div>
    </div>

    <script src="script.js?v=stable-project-video"></script>
</body>

</html>
